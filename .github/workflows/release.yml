name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v1.0.3），需已存在'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify files
        shell: pwsh
        run: |
          $missing = @()
          foreach ($p in @('src/ItemPicker.cs', 'dist/ItemPicker.dll', '说明.txt')) {
            if (-not (Test-Path $p)) { $missing += $p }
          }
          if ($missing.Count -gt 0) { throw ("missing files: " + ($missing -join ', ')) }
          $dll = Get-Item 'dist/ItemPicker.dll'
          "DLL: {0} ({1} bytes)" -f $dll.Name, $dll.Length

      - name: Resolve tag
        id: v
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = '${{ github.ref_name }}' }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'cannot resolve tag' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/BepInEx/plugins | Out-Null
          Copy-Item 'dist/ItemPicker.dll' 'staging/BepInEx/plugins/ItemPicker.dll'
          Copy-Item '说明.txt' 'staging/说明.txt'
          $zip = "ItemPicker-${{ steps.v.outputs.tag }}.zip"
          Compress-Archive -Path 'staging/*' -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | ForEach-Object { "zip: {0} ({1} bytes)" -f $_.Name, $_.Length }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Item Picker ${{ steps.v.outputs.tag }}
          files: ItemPicker-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
